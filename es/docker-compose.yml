services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: now-dedup-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  es-init:
    image: curlimages/curl:8.12.1
    container_name: now-dedup-es-init
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./entity-index.json:/config/entity-index.json:ro
      - ./create-index.sh:/scripts/create-index.sh:ro
    entrypoint: ["/bin/sh", "/scripts/create-index.sh"]
    restart: "no"

volumes:
  es-data:
    name: now-dedup-es-data
